[package]
name = "hyper_connect"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.92"
base64 = "0.22.1"
bytes = "1.8.0"
http-body-util = "0.1.2"
hyper = { version = "1.5.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
percent-encoding = { version = "2.3.1", features = ["std"] }
rustls-pki-types = "1.10.0"
serde = "1.0.215"
serde_json = "1.0.133"
serde_urlencoded = "0.7.1"
tokio = { version = "1.41.0", features = ["macros", "net", "time"] }
tokio-rustls = "0.26.0"
webpki-roots = "0.26.6"

[features]
default = ["http2"]
full = ["http1", "http1_proxy", "http2", "http2_proxy"]
http1 = []
http1_proxy = []
http2 = []
http2_proxy = []

[dev-dependencies]
hyper_connect = { path = ".", features = ["full"] }
dotenvy = "0.15.7"
mockall = "0.13.1"
