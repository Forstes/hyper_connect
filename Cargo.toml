[package]
name = "hyper_connect"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.92"
base64 = "0.22.1"
bytes = "1.8.0"
dotenvy = "0.15.7"
futures = "0.3.31"
http-body-util = "0.1.2"
hyper = { version = "1.5.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
rustls-pki-types = "1.10.0"
tokio = { version = "1.41.0", features = ["macros", "net", "time"] }
tokio-rustls = "0.26.0"
tokio-socks = "0.5.2"
webpki-roots = "0.26.6"
